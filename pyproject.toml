[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextguard"
version = "3.0.0"
description = "Calibrated cross-channel repair of sensor dropout for frozen time-series foundation models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xingjian Zhang", email = "xingjiaz@andrew.cmu.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["time series", "foundation models", "sensor dropout", "missing data", "forecasting"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
estimators = ["scikit-learn>=1.3"]
analysis = ["scikit-learn>=1.3", "matplotlib>=3.8", "datasets>=2.18"]
test = ["pytest>=7", "scikit-learn>=1.3"]

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.22124598"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["experiments/original"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
